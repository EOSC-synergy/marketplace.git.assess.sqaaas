        commands:
        - /usr/bin/env sh .sqa/script.homey-charcoal-albatross.sh
        container: qc.sty_tacky-scarlet-cougar
      github.com/cyfronet-fid/marketplace rubocop:
        commands:
        - /usr/bin/env sh .sqa/script.squeaky-charcoal-rabbit.sh
        container: qc.sty_frumpy-aquamarine-tortoise
  QC.Ver:
