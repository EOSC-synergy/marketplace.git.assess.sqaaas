config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/cyfronet-fid/marketplace:
      branch: development
      repo: https://github.com/cyfronet-fid/marketplace.git
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/cyfronet-fid/marketplace git:
        commands:
        - /usr/bin/env sh .sqa/script.snoopy-turquoise-budgerigar.sh
        container: qc.acc_freaky-platinum-beetle
  QC.Doc:
    repos:
      github.com/cyfronet-fid/marketplace find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.shaky-russet-duck.sh
        container: qc.doc_slimy-buff-butterfly
      github.com/cyfronet-fid/marketplace git:
        commands:
        - /usr/bin/env sh .sqa/script.fuzzy-flax-rabbit.sh
        container: qc.doc_tasty-wheat-mastiff
      github.com/cyfronet-fid/marketplace markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.woolly-burgundy-koala.sh
        container: qc.doc_droopy-firebrick-javanese
  QC.Lic:
    repos:
      github.com/cyfronet-fid/marketplace licensee:
        commands:
        - /usr/bin/env sh .sqa/script.trippy-platinum-malamute.sh
        container: qc.lic_slimy-sepia-impala
  QC.Met:
    repos:
      github.com/cyfronet-fid/marketplace cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.tacky-platinum-shark.sh
        container: qc.met_slimy-xanthic-macaw
  QC.Sty:
    repos:
      github.com/cyfronet-fid/marketplace jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.gloppy-maroon-squid.sh
        container: qc.sty_chummy-ruby-barnacle
      github.com/cyfronet-fid/marketplace rubocop:
        commands:
        - /usr/bin/env sh .sqa/script.stinky-zucchini-toucan.sh
        container: qc.sty_snappy-brass-sparrow
  QC.Ver:
    repos:
      github.com/cyfronet-fid/marketplace get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.skinny-fuchsia-scorpion.sh
        container: qc.ver_slimy-magenta-wildebeest
timeout: 5400
